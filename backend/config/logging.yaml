# VisionOps AI — Logging Configuration
# Uses Python's logging.config.dictConfig format.
# Synchronized with backend/core/config.py as the single source of truth.

version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  verbose:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(pathname)s:%(lineno)d | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S.%f"
  concise:
    format: "[%(levelname)s] %(name)s: %(message)s"
  access:
    format: "%(asctime)s | %(levelname)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: "logging.StreamHandler"
    level: "DEBUG"
    formatter: "concise"
    stream: "ext://sys.stdout"

  app_file:
    class: "logging.handlers.RotatingFileHandler"
    level: "INFO"
    formatter: "standard"
    filename: "logs/optiware_app.log"
    maxBytes: 10485760
    backupCount: 5
    encoding: "utf-8"

  error_file:
    class: "logging.handlers.RotatingFileHandler"
    level: "ERROR"
    formatter: "verbose"
    filename: "logs/optiware_error.log"
    maxBytes: 10485760
    backupCount: 10
    encoding: "utf-8"

  ai_file:
    class: "logging.handlers.RotatingFileHandler"
    level: "INFO"
    formatter: "standard"
    filename: "logs/optiware_ai.log"
    maxBytes: 20971520
    backupCount: 5
    encoding: "utf-8"

  access_file:
    class: "logging.handlers.RotatingFileHandler"
    level: "INFO"
    formatter: "access"
    filename: "logs/optiware_access.log"
    maxBytes: 10485760
    backupCount: 5
    encoding: "utf-8"

loggers:
  visionops:
    level: "INFO"
    handlers:
      - "app_file"
      - "console"
      - "error_file"
    propagate: false
  visionops.ai:
    level: "INFO"
    handlers:
      - "ai_file"
      - "console"
      - "error_file"
    propagate: false
  visionops.api:
    level: "INFO"
    handlers:
      - "access_file"
      - "console"
      - "error_file"
    propagate: false
  visionops.worker:
    level: "INFO"
    handlers:
      - "app_file"
      - "error_file"
    propagate: false
  visionops.analytics:
    level: "INFO"
    handlers:
      - "app_file"
      - "console"
      - "error_file"
    propagate: false
  visionops.business:
    level: "INFO"
    handlers:
      - "app_file"
      - "error_file"
    propagate: false
  visionops.storage:
    level: "INFO"
    handlers:
      - "app_file"
      - "error_file"
    propagate: false

root:
  level: "INFO"
  handlers:
    - "console"
    - "app_file"
    - "error_file"
  propagate: true
