# VisionOps AI — AI/ML Configuration
# Synchronized with backend/core/config.py as the single source of truth.

yolo:
  model_path: "backend/ai/models/detection/yolov11.pt"
  classes_file: "backend/ai/models/config/classes.yaml"
  confidence_threshold: 0.5
  iou_threshold: 0.45
  max_detections: 300

inference:
  device: "auto"
  half_precision: false
  image_size: 640
  batch_size: 8
  num_workers: 2
  warmup: true

video:
  frame_skip: 2
  max_video_duration: 600
  supported_formats:
    - ".mp4"
    - ".avi"
    - ".mov"
    - ".mkv"
    - ".webm"
    - ".flv"
    - ".wmv"
  extraction:
    target_fps: 10
    max_frames: 5000
    quality: 90

bytetrack:
  enabled: true
  track_buffer: 30
  match_threshold: 0.8
  lost_track_buffer: 60
  minimum_box_area: 100
  track_confidence: 0.4
  tracking_frame_skip: 1

validation:
  min_confidence: 0.35
  min_box_width: 10
  min_box_height: 10
  max_aspect_ratio: 5.0
  temporal_validation: true
  temporal_frames: 3

classifier:
  enabled: true
  confidence_threshold: 0.6
  reid_enabled: false

detection:
  warehouse_objects:
    - id: 0
      name: "person"
      label: "Person"
      color: [255, 0, 0]
      trackable: true
      kpi_relevant: true
    - id: 1
      name: "forklift"
      label: "Forklift"
      color: [0, 255, 0]
      trackable: true
      kpi_relevant: true
    - id: 2
      name: "truck"
      label: "Truck"
      color: [0, 0, 255]
      trackable: true
      kpi_relevant: true
    - id: 3
      name: "pallet"
      label: "Pallet"
      color: [255, 255, 0]
      trackable: false
      kpi_relevant: true
    - id: 4
      name: "box"
      label: "Box"
      color: [255, 0, 255]
      trackable: false
      kpi_relevant: false
    - id: 5
      name: "container"
      label: "Container"
      color: [0, 255, 255]
      trackable: false
      kpi_relevant: true
    - id: 6
      name: "helmet"
      label: "Helmet"
      color: [128, 0, 128]
      trackable: false
      kpi_relevant: false
    - id: 7
      name: "safety_vest"
      label: "Safety Vest"
      color: [255, 165, 0]
      trackable: false
      kpi_relevant: false

  zones:
    loading_dock:
      label: "Loading Dock"
      color: [0, 255, 255]
    storage_aisle:
      label: "Storage Aisle"
      color: [255, 255, 0]
    restricted_area:
      label: "Restricted Area"
      color: [255, 0, 0]
    pedestrian_zone:
      label: "Pedestrian Zone"
      color: [0, 255, 0]
