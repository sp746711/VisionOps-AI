# VisionOps AI — Application Settings
# Synchronized with backend/core/config.py as the single source of truth.

project:
  name: "OptiWare AI"
  version: "1.0.0"
  description: "OptiWare AI - Intelligent Warehouse Video Analytics Platform"

environment:
  current: "development"
  debug: true

server:
  host: "0.0.0.0"
  port: 8000

api:
  prefix: "/api/v1"

security:
  secret_key: "change-me-to-a-secure-random-secret-key-in-production"
  jwt:
    algorithm: "HS256"
    access_token_expire_minutes: 30
  password:
    hashing_scheme: "bcrypt"
    min_length: 8

cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "http://127.0.0.1:3000"
  allowed_methods:
    - "*"
  allowed_headers:
    - "*"

uploads:
  upload_directory: "uploads/videos"
  thumbnail_directory: "uploads/thumbnails"
  max_upload_size: 524288000
  allowed_video_extensions:
    - ".mp4"
    - ".avi"
    - ".mov"
    - ".mkv"
    - ".webm"
    - ".flv"
    - ".wmv"

storage:
  data_directory: "data"
  raw_directory: "data/raw"
  processed_directory: "data/processed"
  analytics_directory: "data/analytics"
  archive_directory: "data/archive"
  csv:
    videos: "data/videos.csv"
    detections: "data/detections.csv"
    events: "data/events.csv"
    alerts: "data/alerts.csv"
    kpis: "data/kpis.csv"
    analytics: "data/analytics.csv"
  json:
    summary: "data/summary.json"
  outputs:
    annotated_videos: "outputs/annotated_videos"
    extracted_frames: "outputs/extracted_frames"
    detection_images: "outputs/detection_images"
    previews: "outputs/previews"

reports:
  reports_directory: "reports"
  output:
    pdf: "reports/pdf"
    excel: "reports/excel"
    json: "reports/json"

logging:
  directory: "logs"
  level: "INFO"
  files:
    app: "optiware_app.log"
    error: "optiware_error.log"
    ai: "optiware_ai.log"
    access: "optiware_access.log"

workers:
  enable_workers: true
  cleanup_interval: 3600
  analytics_interval: 600
